name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Skill archive (Claude kit)
        working-directory: kit/skills
        run: zip -qr "$GITHUB_WORKSPACE/huntboard-skill.zip" huntboard
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/huntboard" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: app/Dockerfile
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:${{ steps.v.outputs.version }}
            ${{ steps.img.outputs.name }}:latest
      - uses: softprops/action-gh-release@v2
        with:
          name: Huntboard ${{ steps.v.outputs.version }}
          files: huntboard-skill.zip
          body: |
            - Claude kit: download `huntboard-skill.zip`, add it as a skill in Claude, then ask "Set up my Huntboard".
            - Self-hosted: `docker pull ${{ steps.img.outputs.name }}:${{ steps.v.outputs.version }}` (see docs/deploiement.md).
