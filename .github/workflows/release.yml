name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, without the leading v (e.g. 2.2.0). The tag v<version> is created on the current commit."
        required: true

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then v="${INPUT_VERSION#v}"; else v="${GITHUB_REF_NAME#v}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          # A version with a suffix (2.3.0-beta.1, 2.3.0-rc.1) is a pre-release.
          case "$v" in *-*) pre=true ;; *) pre=false ;; esac
          echo "prerelease=$pre" >> "$GITHUB_OUTPUT"
      - name: Skill archive (Claude kit)
        working-directory: kit/skills
        run: zip -qr "$GITHUB_WORKSPACE/huntboard-skill.zip" huntboard
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/huntboard" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: app/Dockerfile
          push: true
          # Pre-releases never move the "latest" image tag.
          tags: |
            ${{ steps.img.outputs.name }}:${{ steps.v.outputs.version }}
            ${{ steps.v.outputs.prerelease == 'false' && format('{0}:latest', steps.img.outputs.name) || '' }}
      - uses: softprops/action-gh-release@v2
        with:
          name: Huntboard ${{ steps.v.outputs.version }}
          tag_name: v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: huntboard-skill.zip
          prerelease: ${{ steps.v.outputs.prerelease == 'true' }}
          make_latest: ${{ steps.v.outputs.prerelease == 'true' && 'false' || 'true' }}
          body: |
            - Claude kit: download `huntboard-skill.zip`, add it as a skill in Claude, then ask "Set up my Huntboard".
            - Self-hosted: `docker pull ${{ steps.img.outputs.name }}:${{ steps.v.outputs.version }}` (see docs/deploiement.md).
