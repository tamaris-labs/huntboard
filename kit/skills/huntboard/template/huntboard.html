<title>Huntboard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;700&family=Source+Sans+3:wght@400;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: one column, sticky tab bar, cards and panels; overlays for detail, triage, preparation and onboarding */
:root{
  --bg:#F2F5F6; --surface:#FFFFFF; --fg:#13242C; --muted:#5A6E77; --line:#D6DFE2;
  --accent:#0D5A72; --accent-soft:#E0EDF1; --on-accent:#FFFFFF;
  --ok:#1E7A4C; --ok-soft:#E1F2E8; --warn:#9A6400; --warn-soft:#FBEFD6; --far:#6A5A8C; --far-soft:#ECE7F5; --bad:#A33A2E; --bad-soft:#F8E4E1; --sea:#E3EEF3; --land:#FBFCFC; --border:#C3CFD4;
  --scrim:rgba(19,36,44,.45);
  --f-display:"Schibsted Grotesk",system-ui,sans-serif; --f-body:"Source Sans 3",system-ui,sans-serif; --f-mono:"JetBrains Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1A1F; --surface:#16252C; --fg:#E3ECEF; --muted:#93A7AF; --line:#2A3C44;
  --accent:#6FB8D1; --accent-soft:#183843; --on-accent:#0F1A1F;
  --ok:#6CCB97; --ok-soft:#173A29; --warn:#E5B45C; --warn-soft:#3A2E14; --far:#B6A6DC; --far-soft:#2C2540; --bad:#F08A7C; --bad-soft:#3F201C; --sea:#0C2229; --land:#1B2C33; --border:#34484F;
  --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1A1F; --surface:#16252C; --fg:#E3ECEF; --muted:#93A7AF; --line:#2A3C44;
  --accent:#6FB8D1; --accent-soft:#183843; --on-accent:#0F1A1F;
  --ok:#6CCB97; --ok-soft:#173A29; --warn:#E5B45C; --warn-soft:#3A2E14; --far:#B6A6DC; --far-soft:#2C2540; --bad:#F08A7C; --bad-soft:#3F201C; --sea:#0C2229; --land:#1B2C33; --border:#34484F;
  --scrim:rgba(0,0,0,.6); color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 56px}
header h1{font-family:var(--f-display);font-weight:700;font-size:1.6rem;margin:0;letter-spacing:-.01em}
header h1 span{color:var(--accent)}
header p{margin:.2rem 0 0;color:var(--muted);font-size:.9rem}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:2px;margin:16px 0 12px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
nav button{font:600 .95rem var(--f-body);background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);padding:10px 12px;cursor:pointer;white-space:nowrap}
nav button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bar,.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bar{margin-bottom:12px}.row>*{min-width:0}
.chip{font:600 .85rem var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:5px 12px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chip .n{font-family:var(--f-mono);font-size:.75rem;opacity:.75;margin-left:4px}
input[type=search],input[type=text],input[type=url],input[type=password],input[type=email],input[type=tel],input[type=number],input[type=date],input[type=datetime-local],select,textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 9px;max-width:100%}
input[type=search]{flex:1 1 180px}
.field input[type=search]{flex:none;width:100%}
textarea{width:100%;resize:vertical}
.btn{font:600 .9rem var(--f-body);background:var(--accent);color:var(--on-accent);border:1px solid var(--accent);border-radius:6px;padding:7px 14px;cursor:pointer}
.btn.ghost{background:none;color:var(--accent)}
.btn.sm{padding:4px 10px;font-size:.82rem}
.btn.ok{background:var(--ok-soft);color:var(--ok);border-color:var(--ok-soft)}
.btn.no{background:var(--bad-soft);color:var(--bad);border-color:var(--bad-soft)}
.btn:disabled{opacity:.5;cursor:default}
.linkbtn{background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer;text-align:left}
.list{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;display:grid;grid-template-columns:auto 1fr;gap:4px 14px}
.score{grid-row:1/4;font-family:var(--f-mono);font-size:1.35rem;width:3.2rem;text-align:center;padding-top:2px}
.score small{display:block;font-size:.65rem;color:var(--muted)}
.t-match .score{color:var(--ok)} .t-maybe .score{color:var(--warn)} .t-far .score{color:var(--far)} .t-pending .score{color:var(--muted)}
.head{min-width:0;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline}
.head h3{margin:0;font-family:var(--f-display);font-weight:500;font-size:1.05rem;text-wrap:balance;min-width:0}
.head h3 .linkbtn:hover{text-decoration:underline}
.pill{font:600 .7rem var(--f-body);text-transform:uppercase;letter-spacing:.06em;padding:2px 8px;border-radius:4px;white-space:nowrap}
.pill.match{background:var(--ok-soft);color:var(--ok)} .pill.maybe{background:var(--warn-soft);color:var(--warn)} .pill.far{background:var(--far-soft);color:var(--far)} .pill.pending,.pill.assoc{background:var(--accent-soft);color:var(--accent)}
.meta{color:var(--muted);font-size:.88rem;min-width:0}
.meta b{color:var(--fg);font-weight:600}
.why{font-size:.92rem;min-width:0}
.blk{color:var(--bad)}
.acts{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px;padding-top:10px;border-top:1px dashed var(--line)}
.acts .go{margin-left:auto;font-weight:600;color:var(--accent)}
.empty{border:1px dashed var(--line);border-radius:8px;padding:28px 18px;text-align:center;color:var(--muted)}
.state{font-size:.85rem;color:var(--muted);margin:0 0 10px}
h2{font-family:var(--f-display);font-weight:700;font-size:1.05rem;margin:22px 0 8px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field label{font-weight:600;font-size:.88rem}
.hint{font-size:.8rem;color:var(--muted)}
.field textarea{min-height:4.5em}
.src{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.src .nm{min-width:0}.src .nm div{font-size:.8rem;color:var(--muted);overflow-wrap:anywhere}
.sx{border:1px solid var(--line);border-radius:8px;padding:10px;margin:10px 0}.sx h4{margin:10px 0 2px;font-size:.85rem}.sx .why{color:var(--text)}.src .yl{font-size:.75rem;color:var(--muted);white-space:nowrap}
.lesson{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:start;padding:8px 0;border-bottom:1px solid var(--line)}
.lesson div{min-width:0}.lesson small{color:var(--muted)}
nav .tl-s{display:none}
nav .ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px;margin-right:6px}
@media(max-width:640px){
  header p{display:none}
  nav{position:fixed;top:auto;bottom:0;left:0;right:0;margin:0;z-index:15;background:var(--surface);border-bottom:0;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);justify-content:space-around;overflow:visible}
  nav button{flex:1;padding:12px 2px;font-size:.82rem;border-bottom:0;border-top:2px solid transparent}
  nav button[aria-selected="true"]{border-top-color:var(--accent)}
  nav .tl-l{display:none} nav .tl-s{display:block;font-size:.72rem}
  nav .ic{display:block;width:22px;height:22px;margin:0 auto 3px}
  nav button{padding:8px 2px 6px}
  body{padding-bottom:calc(64px + env(safe-area-inset-bottom,0px))}
  body .save{bottom:calc(58px + env(safe-area-inset-bottom,0px))}
  body .toast{bottom:calc(72px + env(safe-area-inset-bottom,0px))}
}
.subnav2{display:flex;flex-wrap:wrap;gap:6px;width:100%;padding:6px 0 2px;border-top:1px dashed var(--line);margin-top:2px}.chip.sm{font-size:.8rem;padding:3px 10px}
.subnav{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;min-width:0}
.panel h2{margin:0 0 10px;font-size:.95rem}
.save{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:center;background:var(--bg);padding:10px 0}
/* kanban */
.kb{display:flex;gap:10px;overflow-x:auto;padding-bottom:10px;align-items:flex-start;margin-top:8px}
.kcol{flex:0 0 230px;background:var(--accent-soft);border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:8px;min-height:140px}
.kcol.over{outline:2px dashed var(--accent);outline-offset:-2px}
.kcol h3{margin:2px 2px 4px;font:600 .9rem var(--f-display);display:flex;justify-content:space-between;gap:8px}
.kcol h3 .n{font-family:var(--f-mono);font-size:.75rem;color:var(--muted)}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:.86rem;cursor:grab;display:flex;flex-direction:column;gap:4px;min-width:0}
.kcard .linkbtn{font-weight:600;overflow-wrap:anywhere}
.kcard select{font-size:.8rem;padding:3px 6px;margin-top:2px}
.klast{color:var(--muted);font-size:.8rem;overflow-wrap:anywhere}
.klast.due{color:var(--bad)}
.kempty{color:var(--muted);font-size:.8rem;margin:4px 2px}
/* momentum */
.mom{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;align-items:start}
.goal{margin:6px 0 10px}.goal .gl{display:flex;justify-content:space-between;gap:8px;font-size:.88rem}
.goal .gt{height:8px;border-radius:4px;background:var(--accent-soft);margin-top:4px;overflow:hidden}.goal .gf{height:100%;background:var(--accent);border-radius:4px}
.goal.done .gf{background:var(--ok)}
.msg{border-left:3px solid var(--accent);padding:8px 12px;background:var(--accent-soft);border-radius:0 6px 6px 0;font-size:.92rem}
.streak{font:500 1.6rem var(--f-mono);color:var(--accent)}
.wins{list-style:none;padding:0;margin:6px 0}.wins li{font-size:.88rem;padding:3px 0;border-bottom:1px dashed var(--line)}.wins small{color:var(--muted)}
.mline{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:.86rem;color:var(--muted);margin-bottom:8px}.mline b{color:var(--fg)}
details.stats>summary{cursor:pointer;font:600 1rem var(--f-body);color:var(--fg)}
details.more>summary{cursor:pointer}
.posting{white-space:pre-wrap;font-size:.88rem;max-height:22em;overflow:auto;border:1px solid var(--line);border-radius:6px;padding:10px;background:var(--bg)}
.ct{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:start;padding:6px 0;border-bottom:1px dashed var(--line);font-size:.9rem}
.ct a{color:var(--accent)}
.pick{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.pick button{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:6px;padding:8px 10px;cursor:pointer;font:inherit}
.pick button[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent);background:var(--accent-soft)}
.pick button small{display:block;color:var(--muted);font-size:.8rem;margin-top:2px}
/* assistant */
.as-act{border:1px solid var(--accent);border-radius:8px;padding:10px 12px;margin:8px 0;background:var(--accent-soft)}
.as-act .it{display:flex;gap:8px;align-items:flex-start;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line)}
.as-act .it:last-of-type{border-bottom:0}
.btn.on{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.memo{padding:8px 0;border-bottom:1px solid var(--line)}.memo p{margin:2px 0;white-space:pre-wrap}
.comp{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:10px 12px;margin-bottom:12px}
.comp .gt{height:8px;border-radius:4px;background:var(--accent-soft);margin:6px 0;overflow:hidden}.comp .gf{height:100%;background:var(--accent)}
.comp.full .gf{background:var(--ok)}
/* guide */
.gstep{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.gstep .gi{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:700 .8rem var(--f-body);border:1.5px solid var(--line);color:var(--muted)}
.gstep.ok .gi{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.gstep.todo .gi{border-color:var(--accent);color:var(--accent)}
.gstep.warn .gi{border-color:var(--warn);color:var(--warn)}
.gstep b{display:block}.gstep p{margin:2px 0 6px;font-size:.88rem;color:var(--muted)}
.banner{border:1px solid var(--warn);background:var(--warn-soft);border-radius:8px;padding:10px 12px;margin:8px 0;font-size:.9rem}
.banner.info{border-color:var(--accent);background:var(--accent-soft)}
/* tracks */
.trk{border:1px solid var(--line);border-radius:8px;background:var(--surface);margin-bottom:10px}
.trk>summary{cursor:pointer;padding:10px 12px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-weight:600}
.trk>div{padding:0 12px 12px}
.pill.trackp{background:var(--far-soft);color:var(--far)}
.chk{display:flex;gap:8px;align-items:center;font-size:.9rem;margin:4px 0}
/* map */
.mapwrap{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;align-items:start}
@media(max-width:700px){.mapwrap{grid-template-columns:1fr}}
.map svg{width:100%;height:auto;display:block;max-width:520px;margin:0 auto}
.map .ring{fill:none;stroke:var(--line)}.map .rl{fill:var(--muted);font:500 10px var(--f-mono)}
.map .axis{stroke:var(--line);stroke-dasharray:2 4}.map .card{fill:var(--muted);font:600 10px var(--f-body)}
.map .home{fill:var(--fg)}.map .pl{fill:var(--fg);font:500 10.5px var(--f-body);paint-order:stroke;stroke:var(--surface);stroke-width:3px}
.map .dot{cursor:pointer;stroke:var(--surface);stroke-width:1.5}.map .dot:focus-visible{outline:none;stroke:var(--fg);stroke-width:2.5}
.map .s-hot{fill:var(--ok)}.map .s-applied{fill:var(--accent)}.map .s-dig{fill:var(--warn)}.map .s-new{fill:var(--far);opacity:.75}
.map .halo{fill:none;stroke:var(--ok);stroke-width:1.5}
.geo{position:relative;border:1px solid var(--line);border-radius:8px;overflow:hidden;touch-action:none;background:var(--sea)}
.geo svg{max-width:none;cursor:grab}.geo svg.drag{cursor:grabbing}
.geo .land{fill:var(--land);stroke:var(--border);vector-effect:non-scaling-stroke;stroke-width:.7}
.geo .deps{fill:none;stroke:var(--border);vector-effect:non-scaling-stroke;stroke-width:.5;stroke-dasharray:2 2}
.geo .zb{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:4px}
.geo .zb button{width:32px;height:32px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:600 1rem var(--f-body);cursor:pointer}
.geo .attr{position:absolute;left:6px;bottom:4px;font-size:.62rem;color:var(--muted)}
.geo .pl{font-size:inherit}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8rem;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.legend .s-hot{background:var(--ok)}.legend .s-applied{background:var(--accent)}.legend .s-dig{background:var(--warn)}.legend .s-new{background:var(--far)}
/* dashboard */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px}
.tl{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.tv{font:500 1.9rem var(--f-mono);font-variant-numeric:tabular-nums;color:var(--accent);margin:4px 0}
.ts{font-size:.82rem;color:var(--muted)}
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.hb{display:grid;grid-template-columns:9.5em 1fr 2.2em;gap:8px;align-items:center;font-size:.85rem;margin:5px 0}
.hbt{background:var(--accent-soft);border-radius:3px;height:12px;overflow:hidden}
.hbf{background:var(--accent);height:100%}
.hb b{font-family:var(--f-mono);font-weight:500;text-align:right;font-variant-numeric:tabular-nums}
.vb{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;height:130px;align-items:end}
.vbc{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.vbf{width:100%;background:var(--accent);border-radius:2px 2px 0 0}
.vbv{font:500 .7rem var(--f-mono);margin-bottom:2px}
.vbl{font:.68rem var(--f-mono);color:var(--muted);height:1.1em;margin-top:3px}
.dl{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:6px;font-size:.88rem}
.dl a,.dl .linkbtn{color:var(--accent);font-weight:600;text-decoration:none}
.dl.links{list-style:none;padding:0;columns:2;display:block}.dl.links li{margin-bottom:6px;break-inside:avoid}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.85rem}
th,td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--line)}
th{font-weight:600;color:var(--muted);font-size:.78rem}
td:nth-child(n+2),th:nth-child(n+2){text-align:right;font-variant-numeric:tabular-nums}
/* overlays */
.ov{position:fixed;inset:0;z-index:20;background:var(--scrim);display:flex;justify-content:center}
.ovb{background:var(--bg);width:100%;max-width:780px;height:100%;overflow-y:auto;padding-top:calc(14px + env(safe-area-inset-top,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ov.sheet{align-items:flex-end}
.ov.sheet .ovb{height:auto;max-height:85%;border-radius:12px 12px 0 0}
.ovh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:8px}
.ovh h2{margin:0;font-size:1.15rem;text-wrap:balance}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.tags .chip{font-size:.8rem;padding:4px 10px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.sb{display:grid;grid-template-columns:8em 1fr 3.4em;gap:8px;align-items:center;font-size:.84rem;margin:4px 0}
.sb b{font-family:var(--f-mono);font-weight:500;text-align:right}
.tl-list{list-style:none;margin:6px 0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:.88rem}
.tl-list li{border-left:2px solid var(--accent);padding-left:10px}
.tl-list time{color:var(--muted);font-family:var(--f-mono);font-size:.78rem;margin-right:6px}
.md{line-height:1.55;font-size:.95rem;margin-top:12px;overflow-wrap:anywhere}
.md h3{font-family:var(--f-display);font-size:1rem;margin:16px 0 6px;color:var(--accent)}
.md h4{font-size:.95rem;margin:12px 0 4px}
.md ul{margin:4px 0;padding-left:1.2em}.md p{margin:6px 0}
.chat{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.bub{padding:8px 12px;border-radius:8px;max-width:88%;white-space:pre-wrap;font-size:.93rem;overflow-wrap:anywhere}
.bub.r{background:var(--accent-soft);align-self:flex-start}
.bub.c{background:var(--surface);border:1px solid var(--line);align-self:flex-end}
.prop{border:1px solid var(--line);border-radius:8px;padding:10px;margin-top:10px;background:var(--surface)}
.prop label{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:start;padding:6px 0;border-bottom:1px dashed var(--line)}
.prop label div{min-width:0;white-space:pre-wrap;font-size:.88rem;overflow-wrap:anywhere}
.steps{display:flex;gap:4px;margin:6px 0 14px}.steps i{flex:1;height:4px;border-radius:2px;background:var(--line)}.steps i.on{background:var(--accent)}
.doc{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.doc .nm{min-width:0;overflow-wrap:anywhere}@media(max-width:560px){.doc{grid-template-columns:1fr}}.doc .nm small{display:block;color:var(--muted)}

.help ol{margin:6px 0 8px;padding-left:1.2em}.help li{margin:3px 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:6px;font-size:.9rem;z-index:40;max-width:90vw}

@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

/* ---------- utilities ---------- */
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const D=864e5;
function toast(msg){const el=$("toast");el.textContent=msg;el.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>{el.hidden=true},2400)}
function fmtDate(s){if(!s)return"";const d=new Date(s);return isNaN(d)?s:d.toLocaleDateString(lang==="en"?"en-GB":"fr-FR",{day:"numeric",month:"short"})}
function dayKey(d){const x=new Date(d);return isNaN(x)?"":x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0")}
function md(src){const out=[];let ul=false;esc(src).split("\n").forEach(l=>{const s=l.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");const li=/^\s*[-*•]\s+(.*)/.exec(s);if(li){if(!ul){out.push("<ul>");ul=true}out.push(`<li>${li[1]}</li>`);return}if(ul){out.push("</ul>");ul=false}if(/^#{1,2}\s/.test(s))out.push(`<h3>${s.replace(/^#+\s*/,"")}</h3>`);else if(/^#{3,}\s/.test(s))out.push(`<h4>${s.replace(/^#+\s*/,"")}</h4>`);else if(s.trim())out.push(`<p>${s}</p>`)});if(ul)out.push("</ul>");return out.join("")}
function parseJSON(text){text=String(text).trim();try{return JSON.parse(text)}catch(e){}const f=/```(?:json)?\s*([\s\S]*?)```/.exec(text);if(f){try{return JSON.parse(f[1])}catch(e){}}const a=[text.indexOf("{"),text.indexOf("[")].filter(i=>i>=0);if(a.length){const s=Math.min(...a),e=Math.max(text.lastIndexOf("}"),text.lastIndexOf("]"));if(e>s)return JSON.parse(text.slice(s,e+1))}throw new Error("no json")}
async function copyText(txt){try{await navigator.clipboard.writeText(txt);toast(t("copied"))}catch(e){const ta=document.createElement("textarea");ta.value=txt;document.body.append(ta);ta.select();try{document.execCommand("copy");toast(t("copied"))}catch(_){}ta.remove()}}
function loadScript(src){return new Promise((res,rej)=>{if(document.querySelector(`script[src="${src}"]`))return res();const s=document.createElement("script");s.src=src;s.onload=()=>res();s.onerror=()=>rej(new Error("load "+src));document.head.append(s)})}

function eff(id){const n=noteOf(id);const s=n.status||"nouvelle";return s==="nouvelle"&&n.fav?"creuser":s}
function isArchived(o){if(eff(o.id)!=="nouvelle")return false;const days=Number(config&&config.archive_days)||30;return o.found_at&&Date.now()-new Date(o.found_at)>days*D}

async function writeNote(id,patch){
  if(!db){toast(t("no_db"));return}
  const cur={...noteOf(id),...patch,updated_at:new Date().toISOString()};notes[id]=cur;
  try{await db.collection("notes").doc(id).set(cur)}catch(e){toast(t("save_failed",e.message||e.code))}
}
async function saveConfig(patch){
  if(!db){toast(t("no_db"));return}
  config={...(config||{}),...patch,updated_at:new Date().toISOString()};
  try{await db.doc("config/main").set(config);return true}catch(e){toast(t("save_failed",e.message||e.code));return false}
}

function outLang(){return lang==="en"?"English":"French"}
function style(){return lang==="en"?"Write in clear professional English, with no hollow corporate jargon and no self-deprecation.":"Write in formal French (« français soutenu »): never use the pronoun « on », no self-deprecation, no hollow managerial jargon (« leadership », « l'humain au centre »)."}
const FACTS="Never present as fact anything absent from the material provided; flag what must be verified.";
function errMsg(e){const c=e&&e.code;if(c==="cancelled")return t("stopped");if(["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"].includes(c))return t("err_auth");if(c==="rate_limited")return t("err_rate");if(c==="session_expired")return t("err_session");if(c==="prompt_too_large")return t("err_long");return t("err_generic")}
async function ai(input,{out,st,tier:mt="default",stream=true}={}){
  if(!sampleFn){if(st)st.textContent=t("err_noai");return null}
  if(st)st.textContent=t("thinking");
  try{const r=await sampleFn(input,{cache:false,modelTier:mt,onText:stream?({text})=>{if(out)out.innerHTML=md(text);if(st)st.textContent=t("writing")}:undefined});if(st)st.textContent=r.truncated?t("truncated"):"";return r.text}
  catch(e){if(st)st.textContent=errMsg(e);if(out&&e&&e.text)out.innerHTML=md(e.text);return null}
}
function cvText(){return ((cv&&cv.text)||"").slice(0,14000)}
function criteriaText(){const c=config||{};return ["roles","domains","geo","contracts","exclusions","partners","free"].map(k=>c[k]?`${k.toUpperCase()}:\n${c[k]}`:"").filter(Boolean).join("\n\n")+(c.salary_min_k?`\nSALARY FLOOR: ${c.salary_min_k}k`:"")}
function offerText(o){const n=noteOf(o.id);return [`Title: ${o.title}`,`Company: ${o.company||""}`,`Location: ${o.location||""}`,`Contract: ${o.contract||""}`,`Remote: ${o.remote||""}`,`Pay: ${o.salary||""}`,`Link: ${o.url||""}`,`Fit analysis: ${o.reasons||""}`,o.blockers?`Blockers: ${o.blockers}`:"",(postings[o.id]&&postings[o.id].text)?`Posting text: ${String(postings[o.id].text).slice(0,12000)}`:o.raw_text?`Posting summary: ${String(o.raw_text).slice(0,8000)}`:"",(noteOf(o.id).contacts||[]).length?`Contacts: ${(noteOf(o.id).contacts||[]).map(c=>[c.name,c.role].filter(Boolean).join(", ")).join(" ; ")}`:"",n.note?`Candidate's notes: ${n.note}`:"",(n.events||[]).length?`History: ${(n.events||[]).map(e=>e.at.slice(0,10)+" "+e.text).join(" | ")}`:"",`Stage: ${t("st_"+eff(o.id))}`].filter(Boolean).join("\n")}

function kcard(o){const n=noteOf(o.id),s=eff(o.id);const due=n.next_due&&new Date(n.next_due)<new Date(dayKey(Date.now()));const line=n.next_action?`→ ${n.next_action}${n.next_due?" · "+fmtDate(n.next_due):""}`:((n.note||"").trim().split("\n").pop()||"");

  return `<article class="kcard" draggable="true" data-id="${esc(o.id)}">${effTrack(o)?`<span class="pill trackp">${esc((trackOf(o)||{}).name||effTrack(o))}</span> `:""}<button class="linkbtn" type="button" data-act="open">${esc(o.title)}</button><div class="meta">${esc(o.company||"")}${o.score!=null?" · "+esc(o.score)+"/100":""}</div>${line?`<div class="klast${due?" due":""}">${esc(line.length>140?line.slice(0,140)+"…":line)}</div>`:""}<select data-act="status" aria-label="${esc(t("d_status"))}">${opts}</select></article>`}

let statsOpen=false;
function renderDash(){
  if(!offers.length){$("dash").innerHTML=momPanel("")+`<div class="empty">${t("dash_empty")}</div>`;bindMom();return}
  const now=Date.now();const c={};offers.forEach(o=>{const s=eff(o.id);c[s]=(c[s]||0)+1});
  const todo=offers.filter(o=>eff(o.id)==="nouvelle"&&!isArchived(o)&&inMain(o));
  const trNew=offers.filter(o=>!inMain(o)&&eff(o.id)==="nouvelle"&&!isArchived(o)).length;
  const tz={match:0,maybe:0};todo.forEach(o=>{if(tz[o.tier]!=null)tz[o.tier]++});
  const week=offers.filter(o=>now-new Date(o.found_at)<7*D).length;
  const active=(c.postule||0)+(c.entretien||0)+(c.offre||0);const sent=active+(c.non_retenu||0);
  const rate=sent?Math.round(((c.entretien||0)+(c.offre||0))/sent*100)+" %":"–";
  const tiles=[[t("tiles_todo"),todo.length,t("t_match",tz.match,tz.maybe)],[t("tiles_week"),week,t("t_total",offers.length)],[t("tiles_active"),active,t("t_int",c.entretien||0)],[t("tiles_rate"),rate,t("t_on",sent)]];if(tracksCfg().length)tiles.push([t("tr_new_tile"),trNew,t("tr_new_sub")(trNew)]);
  const funnel=["nouvelle","creuser","postule","entretien","offre","non_retenu","ecartee"].map(k=>[t("st_"+k),k==="nouvelle"?todo.length:(c[k]||0)]);const fmax=Math.max(1,...funnel.map(f=>f[1]));
  const days=[];for(let i=13;i>=0;i--)days.push(dayKey(now-i*D));const per=days.map(k=>offers.filter(o=>dayKey(o.found_at)===k).length);const dmax=Math.max(1,...per);
  const dueList=offers.filter(o=>noteOf(o.id).next_due&&KCOLS.includes(eff(o.id))).sort((a,b)=>String(noteOf(a.id).next_due).localeCompare(String(noteOf(b.id).next_due)));
  const stale=offers.filter(o=>["postule","entretien","creuser"].includes(eff(o.id))&&!noteOf(o.id).next_due&&now-new Date(noteOf(o.id).updated_at||o.found_at)>7*D);
  const exp=todo.filter(o=>/expir/i.test(o.blockers||""));
  const best=todo.filter(o=>o.score!=null).sort((a,b)=>b.score-a.score).slice(0,5);
  const src={};offers.forEach(o=>{const k=(o.source||"—").replace(/\s*\(.*$/,"");(src[k]=src[k]||[]).push(o)});
  const srcRows=Object.entries(src).sort((a,b)=>b[1].length-a[1].length).slice(0,8).map(([k,l])=>{const sc=l.filter(o=>o.score!=null);const avg=sc.length?Math.round(sc.reduce((s,o)=>s+o.score,0)/sc.length):"–";const kept=l.filter(o=>KCOLS.includes(eff(o.id))).length;return `<tr><td>${esc(k)}</td><td>${l.length}</td><td>${avg}</td><td>${kept}</td></tr>`}).join("");
  const links=[...((config&&config.sources)||[]).filter(s=>s.url&&s.active!==false).map(s=>[s.name,s.url]),[t("link_alerts"),"https://www.linkedin.com/jobs/"]];
  const li=(o,extra)=>`<li data-id="${esc(o.id)}"><button class="linkbtn" type="button" data-act="open">${esc(o.title)}</button> <span class="meta">${esc(o.company||"")}${extra?" · "+esc(extra):""}</span></li>`;
  const todoHtml=(dueList.length?`<p class="meta">${t("due_actions")}</p><ul class="dl">${dueList.map(o=>li(o,(noteOf(o.id).next_action||"")+" · "+fmtDate(noteOf(o.id).next_due))).join("")}</ul>`:"")+(exp.length?`<p class="meta">${t("expiring")}</p><ul class="dl">${exp.map(o=>li(o)).join("")}</ul>`:"")+(stale.length?`<p class="meta">${t("to_follow")}</p><ul class="dl">${stale.map(o=>li(o)).join("")}</ul>`:"");
  $("dash").innerHTML=`${momPanel(todoHtml)}<div class="tiles">${tiles.map(([l,v,s])=>`<div class="tile"><div class="tl">${l}</div><div class="tv">${esc(v)}</div><div class="ts">${s}</div></div>`).join("")}</div>
  <div class="panel" style="margin-bottom:12px"><h2>${t("d_map")}</h2><div id="map-box"></div></div>
  <div class="dgrid">

  r.onresult=e=>{let txt="";for(const x of e.results)txt+=x[0].transcript;target.value=base+txt;const last=e.results[e.results.length-1];if(last.isFinal&&onFinal)onFinal(target.value)};
  r.onerror=e=>{toast(e.error==="not-allowed"||e.error==="service-not-allowed"||e.error==="audio-capture"?t("mic_denied"):t("mic_err"))};

/* ---------- momentum (goals, streak, next step, progress log) ---------- */
let mom={goals:{applied:3,triaged:15,network:2},network:{},wins:[]};
const tf=(k,...a)=>t(k)(...a);
function weekStart(d=new Date()){const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
const wk=d=>dayKey(weekStart(d));
function momStats(){
  const ws=weekStart().getTime();const inW=v=>v&&new Date(v).getTime()>=ws;
  const N=Object.entries(notes);
  const applied=N.filter(([,n])=>inW(n.applied_at)).length;
  const triaged=N.filter(([,n])=>n.status&&n.status!=="nouvelle"&&inW(n.updated_at)).length;
  const network=(mom.network||{})[wk()]||0;
  const days=new Set();N.forEach(([,n])=>{[n.updated_at,n.applied_at,...(n.events||[]).map(e=>e.at)].forEach(v=>{if(v)days.add(dayKey(v))})});(mom.wins||[]).forEach(w=>days.add(dayKey(w.at)));(mom.active_days||[]).forEach(d=>days.add(d));
  let streak=0;const c=new Date();if(!days.has(dayKey(c)))c.setDate(c.getDate()-1);while(days.has(dayKey(c))){streak++;c.setDate(c.getDate()-1)}
  return {applied,triaged,network,streak}
}
function autoWins(){const out=[];offers.forEach(o=>{(noteOf(o.id).events||[]).forEach(e=>{if(e.text===t("st_entretien"))out.push({at:e.at,text:tf("w_interview",o.company||o.title)});if(e.text===t("st_offre"))out.push({at:e.at,text:tf("w_offer",o.company||o.title)})})});return out}
function nextStep(){
  const now=Date.now();const due=offers.filter(o=>noteOf(o.id).next_due&&KCOLS.includes(eff(o.id))&&new Date(noteOf(o.id).next_due).getTime()<=now+D).sort((a,b)=>String(noteOf(a.id).next_due).localeCompare(String(noteOf(b.id).next_due)))[0];
  if(due)return {text:tf("s_due",noteOf(due.id).next_action||t("st_"+eff(due.id)),due.company||due.title),id:due.id,act:"open"};
  const iv=offers.filter(o=>eff(o.id)==="entretien"&&noteOf(o.id).interview_at&&new Date(noteOf(o.id).interview_at).getTime()>now-D/2&&new Date(noteOf(o.id).interview_at).getTime()<now+4*D)[0];
  if(iv)return {text:tf("s_prep",iv.company||iv.title),id:iv.id,act:"prep"};
  const best=offers.filter(o=>eff(o.id)==="nouvelle"&&!isArchived(o)&&inMain(o)&&o.tier==="match").sort((a,b)=>(b.score||0)-(a.score||0))[0];
  if(best)return {text:tf("s_triage",(best.company?best.company+" — ":"")+best.title),id:best.id,act:"open"};
  return {text:t("s_network"),act:"network"}
}
function momMessage(st){
  const now=Date.now();const iv=offers.filter(o=>eff(o.id)==="entretien"&&noteOf(o.id).interview_at&&new Date(noteOf(o.id).interview_at).getTime()>now-D/2).sort((a,b)=>String(noteOf(a.id).interview_at).localeCompare(String(noteOf(b.id).interview_at)))[0];
  if(iv)return tf("m_interview",iv.company||iv.title,fmtDate(noteOf(iv.id).interview_at));
  const refused=offers.some(o=>eff(o.id)==="non_retenu"&&now-new Date(noteOf(o.id).updated_at||0)<3*D);if(refused)return t("m_refusal");
  const g=mom.goals.applied||0;if(g&&st.applied>=g)return tf("m_goal_met",st.applied+"/"+g);if(st.applied)return tf("m_half",st.applied,g||st.applied);
  const best=offers.filter(o=>eff(o.id)==="nouvelle"&&!isArchived(o)&&inMain(o)&&o.score!=null).sort((a,b)=>b.score-a.score)[0];if(best)return tf("m_start",(best.company?best.company+" — ":"")+best.title,best.score);

}

  const ns=nextStep();const wins=[...autoWins(),...(mom.wins||[])].sort((a,b)=>String(b.at).localeCompare(String(a.at))).slice(0,5);

  const prompt=`You help a job seeker choose where their daily job watch should look. Suggest up to 8 NEW sources (job boards, specialised professional networks and clusters, recruitment firms, employers' career pages, co-founder matching services, public programmes) that fit THIS person, then list current sources that look useless given their yield. Give only sources you are confident exist; leave "url" empty when unsure of the exact address (it will be checked on the web later). Never suggest sources that require the person's login to list offers, nor reading LinkedIn directly.\n\n${candidate()}\n\nCRITERIA\n${criteriaText()}\nCOUNTRY: ${(config&&config.country)||""}\nHOME: ${(config&&config.home_address)||""}\n\nCURRENT MAIN SOURCES WITH YIELD (found = offers collected, kept = offers the person followed)\n${JSON.stringify(srcYield((config&&config.sources)||[]))}\n\nEXTRA TRACKS (set "target" to a track id when the source belongs to that track, else "main")\n${JSON.stringify(tracks)}\n\nALREADY SUGGESTED (do not repeat)\n${JSON.stringify((sx.items||[]).map(x=>x.name))}\n\nWrite "note" (how the watch should read the source) and "why" (one sentence on why it fits this person) in ${outLang()}. ${style()}\nAnswer with JSON only: {"suggestions":[{"name":"","url":"","note":"","why":"","target":"main"}],"weak":[{"name":"","why":""}]}`;
  const txt=await ai(prompt,{st:$("sx-st"),stream:false});sxBusy=false;if(!txt){drawSx();return}
  let r;try{r=parseJSON(txt)}catch(e){$("sx-st").textContent=t("sx_err");drawSx();return}
  const n=await sxMerge(r.suggestions,"ai",r.weak);$("sx-st").textContent=n?t("sx_got",n):t("sx_none")}
function sxWebMode(){if(APP&&APP.verifySources)return "app";if(mcp&&config&&config.source_task_id)return "task";return ""}
async function sxWeb(){if(sxBusy)return;const mode=sxWebMode();if(!mode)return;sxBusy=true;drawSx();
  if(mode==="app"){$("sx-st").textContent=t("sx_web_run");try{const doc=await APP.verifySources(null,4);if(doc&&doc.items)sx={items:[],...doc};$("sx-st").textContent=t("sx_web_done")}catch(e){$("sx-st").textContent=t("sx_web_err")}sxBusy=false;drawSx();return}

  try{await mcp.callTool("Claude Code Remote","fire_trigger",{trigger_id:String(config.source_task_id),text:`Demande envoyée depuis la page Huntboard le ${at}.`});await saveSx({...sx,verify:{state:"requested",requested_at:at,by:"task"}});$("sx-st").textContent=t("sx_web_sent")}

function drawSx(){const box=$("sx-list");if(!box)return;const mode=sxWebMode();$("sx-web").hidden=!mode;$("sx-ai").disabled=sxBusy;$("sx-web").disabled=sxBusy;
  const items=sx.items||[],cls={ok:"match",moved:"maybe",unverified:"pending",not_checked:"pending",no_url:"pending",blocked:"far",unreachable:"far"};

  html+=items.map((it,i)=>`<div class="src"><input type="checkbox" id="sx-${i}" data-sx="${i}" aria-label="${esc(it.name)}"><div class="nm"><label for="sx-${i}">${esc(it.name)}</label> <span class="pill ${cls[it.status]||"pending"}">${t("sx_st_"+(it.status||"unverified"))}</span><div class="why">${esc(it.why||"")}</div><div>${it.url?`<a href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.url)}</a> · `:""}${esc(sxTargetLabel(it.target))} · ${t("sx_or_"+(it.origin||"ai"))}</div></div><button class="btn ghost sm" data-sxrm="${i}" type="button">${t("sx_drop")}</button></div>`).join("");
  if(items.length)html+=`<div class="row" style="margin-top:8px"><button class="btn sm" id="sx-addsel" type="button">${t("sx_add")}</button></div>`;
  const weak=(sx.weak||[]).filter(w=>((config&&config.sources)||[]).some(x=>normS(x.name)===normS(w.name)&&x.active!==false));
  if(weak.length)html+=`<h4>${t("sx_weak")}</h4><p class="meta">${t("sx_weak_hint")}</p>`+weak.map((w,i)=>`<div class="src"><input type="checkbox" id="sxw-${i}" data-sxw="${esc(w.name)}" aria-label="${esc(w.name)}"><div class="nm"><label for="sxw-${i}">${esc(w.name)}</label><div>${esc(w.why||"")}</div></div><span></span></div>`).join("")+`<div class="row" style="margin-top:8px"><button class="btn ghost sm" id="sx-weakoff" type="button">${t("sx_disable")}</button></div>`;
  if(v.state==="requested")html+=`<p class="meta">${t("sx_web_req",fmtDate(v.requested_at))}</p>`;else if(v.done_at)html+=`<p class="meta">${t("sx_web_at",fmtDate(v.done_at))}</p>`;
  if(!mode&&!APP)html+=`<p class="meta">${t("sx_web_setup")}</p>`;
  box.innerHTML=html}

/* CV */
const PDFJS="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js",PDFW="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js",MAMMOTH="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js";
async function readCV(file){const name=file.name.toLowerCase();if(name.endsWith(".pdf")){await loadScript(PDFJS);window.pdfjsLib.GlobalWorkerOptions.workerSrc=PDFW;const pdf=await window.pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;let out="";for(let i=1;i<=pdf.numPages;i++){const pg=await pdf.getPage(i);const tc=await pg.getTextContent();out+=tc.items.map(x=>x.str+(x.hasEOL?"\n":" ")).join("")+"\n\n"}return out}if(name.endsWith(".docx")){await loadScript(MAMMOTH);const r=await window.mammoth.extractRawText({arrayBuffer:await file.arrayBuffer()});return r.value}return await file.text()}
async function saveCV(text,filename){cv={...(cv||{}),text,filename:filename||(cv&&cv.filename)||"",updated_at:new Date().toISOString()};if(db){try{await db.doc("profile/cv").set(cv)}catch(e){toast(t("save_failed",e.message||e.code))}}}
async function handleCvFile(file,stEl,textEl){if(!file)return;stEl.textContent=t("cv_reading");try{const txt=(await readCV(file)).replace(/[ \t]+\n/g,"\n").replace(/\n{3,}/g,"\n\n").trim();textEl.value=txt;stEl.textContent=t("cv_read",txt.length);await saveCV(txt,file.name)}catch(e){stEl.textContent=t("cv_fail")}}
$("cv-file").onchange=e=>{$("cv-help").hidden=true;handleCvFile(e.target.files[0],$("cv-st"),$("cv-text"))};
/* The Claude mobile app can block file pickers in artifacts. The page cannot detect it directly:
   when a picker opens, the page loses focus; if nothing happens within 1.5 s, explain the alternatives. */
function pickFile(input,help,textarea){
  let reacted=false;const mark=()=>{reacted=true};
  window.addEventListener("blur",mark,{once:true});document.addEventListener("visibilitychange",mark,{once:true});input.addEventListener("change",mark,{once:true});
  help.hidden=true;try{input.click()}catch(e){}
  setTimeout(()=>{if(reacted)return;const items=t("pick_help").filter((x,i)=>textarea||i!==1);help.innerHTML=`<b>${t("pick_help_title")}</b><ol>${items.map(x=>`<li>${esc(x)}</li>`).join("")}</ol>${textarea?`<button class="btn ghost sm" type="button">${t("pick_paste")}</button>`:""}`;if(textarea)help.querySelector("button").onclick=()=>{help.hidden=true;textarea.focus();textarea.scrollIntoView({block:"center"})};help.hidden=false},1500);
}

async function analyseCV(stEl,container,cvValue){const txt=(cvValue||cvText()).slice(0,14000);if(!txt)return null;const r=await ai(`Analyse this CV and propose job-search settings for its owner. Infer target roles and fields from the actual experience; propose a realistic salary floor only if the CV gives clear grounds, else null. Write the profile as a factual 150-250 word summary (background, quantified achievements, target). Values in ${outLang()}. ${style()} ${FACTS}\n\nCURRENT CRITERIA\n${criteriaText()||"(none)"}\n\nCV\n${txt}\n\nReply with only JSON: ${PROP_SHAPE}`,{st:stEl,tier:"complex",stream:false});if(!r)return null;try{const p=parseJSON(r);if(container)showProposal(container,p);return p}catch(e){stEl.textContent=t("err_generic");return null}}

/* cover letters */
const LLEN={short:180,std:280,long:400};
function refLetters(){return docs.filter(d=>d.kind==="letter"&&d.text).slice(0,3)}
function refsText(){const r=refLetters();return r.length?"\n\nTHE CANDIDATE'S PREVIOUS LETTERS (reuse their voice, structure and recurring arguments where relevant; never copy facts specific to another employer)\n"+r.map((d,i)=>`--- Letter ${i+1} (${d.name})\n${d.text.slice(0,3500)}`).join("\n"):""}
function langStyle(code){return code===lang||(code==="fr"&&lang!=="en")?style():`Write in ${TR_LANGS[code]||code}, in a formal professional register, with no hollow jargon.`}
function letterPrompt({ad,code,words,instr,refs}){return `Write a cover letter of about ${words} words for this candidate and this job posting, in ${TR_LANGS[code]||outLang()}. ${langStyle(code)} ${FACTS} Ground every claim in the profile and CV; do not invent achievements, figures or employers. Structure: why this company and role, two or three concrete proofs from the career that answer the posting's needs, availability and a closing line. Output only the letter, ready to send (no placeholders except the recipient's name when unknown).${instr?"\n\nCANDIDATE'S INSTRUCTIONS\n"+instr:""}\n\nJOB POSTING\n${ad}\n\n${candidate()}${refs?refsText():""}`}
let lmOfferId="",lmFilter="followed";
const LM_RANK={entretien:0,offre:1,postule:2,creuser:3,nouvelle:4};
const lmNorm=x=>String(x||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
function lmCandidates(){const q=lmNorm($("lm-q").value).split(/\s+/).filter(Boolean);const T=tracksCfg();
  return offers.filter(o=>{const s=eff(o.id);if(s==="ecartee"||s==="non_retenu")return false;
    if(lmFilter==="followed"&&!["creuser","postule","entretien","offre"].includes(s))return false;
    if(lmFilter==="new"&&(s!=="nouvelle"||isArchived(o)||!inMain(o)))return false;
    if(lmFilter.startsWith("tr:")&&effTrack(o)!==lmFilter.slice(3))return false;
    if(lmFilter==="all"&&s==="nouvelle"&&isArchived(o))return false;
    const hay=lmNorm([o.title,o.company,o.location,o.contract,o.source,(noteOf(o.id).contacts||[]).map(c=>c.name).join(" ")].join(" "));return q.every(w=>hay.includes(w))})
    .sort((a,b)=>(LM_RANK[eff(a.id)]??9)-(LM_RANK[eff(b.id)]??9)||(b.score||0)-(a.score||0))}
function drawLetterPicker(){const T=tracksCfg().filter(x=>offers.some(o=>effTrack(o)===x.id));const fl=[["followed",t("lmf_followed")],["new",t("lmf_new")],...T.map(x=>["tr:"+x.id,x.name||x.id]),["all",t("lmf_all")],["paste",t("lmf_paste")]];

  const paste=lmFilter==="paste";$("lm-q").hidden=paste;$("lm-ad-f").hidden=!paste;if(paste){lmOfferId="";$("lm-list").innerHTML="";return}
  const all=lmCandidates();const sel=offerById(lmOfferId);const shown=all.slice(0,8);if(sel&&!shown.includes(sel))shown.unshift(sel);
  $("lm-list").innerHTML=shown.length?shown.map(o=>`<button type="button" data-lmo="${esc(o.id)}" aria-pressed="${o.id===lmOfferId}"><b>${esc(o.title)}</b>${o.company?" — "+esc(o.company):""}<small>${esc([o.location,t("st_"+eff(o.id)),o.score!=null?o.score+"/100":"",(trackOf(o)||{}).name,postings[o.id]&&postings[o.id].text?t("lm_full"):""].filter(Boolean).join(" · "))}</small></button>`).join("")+(all.length>8?`<p class="meta">${esc(tf("lm_more",all.length-8))}</p>`:""):`<p class="meta">${t("lm_nores")}</p>`}

/* documents (original files and translations, stored as artifact assets) */
const MIME={pdf:"application/pdf",md:"text/markdown",txt:"text/plain"};
function fmtSize(n){return n>1048576?(n/1048576).toFixed(1)+" Mo":Math.max(1,Math.round(n/1024))+" Ko"}
function drawDocs(){$("docs").innerHTML=docs.length?docs.map(d=>`<div class="doc" data-doc="${esc(d.id)}"><div class="nm"><b>${esc(d.name)}</b><small>${esc((t("doc_kinds")[d.kind]||d.kind)+(d.offer_label?" · "+d.offer_label:"")+" · "+(TR_LANGS[d.lang]||d.lang||"")+" · "+fmtSize(d.size||0)+" · "+fmtDate(d.created_at))}</small></div><div class="row"><a class="btn ghost sm" href="/_blob/${esc(d.asset_id)}" target="_blank" rel="noopener">${t("doc_open")}</a><button class="btn ghost sm" type="button" data-dl>${t("doc_dl")}</button><button class="btn ghost sm" type="button" data-rm>${t("remove")}</button></div></div>`).join(""):`<p class="meta">${t("docs_none")}</p>`}
async function addDocument(blob,filename,type,kind,dlang,extra={}){
  if(!assets||!db){$("doc-st").textContent=t("doc_noassets");return}
  $("doc-st").textContent="…";
  try{const r=await assets.upload(blob,{type});const id="d-"+Date.now().toString(36);let text=extra.text;if(text==null&&blob instanceof File){try{text=await readCV(blob)}catch(e){text=""}}await db.collection("documents").doc(id).set({id,name:filename,filename,kind,lang:dlang,asset_id:r.id,size:r.sizeBytes,content_type:r.contentType,created_at:new Date().toISOString(),...extra,text:String(text||"").slice(0,15000)});$("doc-st").textContent="";toast(t("doc_added"))}
  catch(e){$("doc-st").textContent=t("save_failed",(e&&(e.message||e.code))||"")}
}

  db.collection("postings").onSnapshot(s=>{postings={};s.docs.forEach(d=>{postings[d.id]=d.data()});if(detailId&&!$("detail").hidden&&!document.activeElement.closest("#detail"))drawDetail()});
  db.collection("documents").onSnapshot(s=>{docs=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>String(b.created_at).localeCompare(String(a.created_at)));drawDocs();if(section==="docs")fillLetterOffers()});
  db.doc("coach/main").onSnapshot(d=>{if(d.exists&&!$("co-send").disabled){coach=d.data();if(view==="coach")drawCoach()}});
})();
</script>
